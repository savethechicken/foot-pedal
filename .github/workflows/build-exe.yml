# Builds the release downloads on a Windows machine at GitHub:
#   - Pedal Config.exe : the config app (no Python needed)
#   - firmware.zip     : boot.py, code.py and lib/ - unzip and copy onto CIRCUITPY
#
# - Publish a release (Releases -> Draft a new release) and both files are
#   attached to it automatically.
# - Or run it by hand: Actions tab -> "Build release files" -> Run workflow.
#   Leave "tag" empty to just build (files appear as artifacts on that run),
#   or enter an existing release tag (like v1.0) to add firmware.zip to it.

name: Build release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to add firmware.zip to (optional)"
        required: false
        default: ""

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install pyserial pyinstaller

      - name: Build the .exe
        run: python -m PyInstaller --onefile --windowed --name "Pedal Config" app/pedal_config.py

      # Zip the CONTENTS of firmware/ (not the folder itself), so unzipping
      # gives boot.py, code.py and lib/ ready to drag onto CIRCUITPY.
      - name: Build firmware.zip
        shell: pwsh
        run: Compress-Archive -Path firmware\* -DestinationPath dist\firmware.zip

      - name: Save the files on this run
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/Pedal Config.exe
            dist/firmware.zip

      - name: Attach both files to the new release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pedal Config.exe
            dist/firmware.zip

      # Manual run with a tag: add only firmware.zip, so an existing,
      # already-tested .exe on that release is left alone.
      - name: Add firmware.zip to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/firmware.zip
